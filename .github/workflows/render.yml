name: render

# Les crons GitHub sont en UTC (Paris = UTC+1 l'hiver, UTC+2 l'été) et "au mieux" :
# un passage peut avoir quelques minutes de retard.
on:
  schedule:
    - cron: "*/5 4-6 * * 1-5"      # matins de semaine : temps réel du tram
    - cron: "3 11 * * 1-5"         # midi : aperçu du lendemain
    - cron: "*/10 14-21 * * 1-5"   # soirs de semaine : avions pour la télé
    - cron: "*/10 7-20 * * 0,6"    # week-end : avions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache du GTFS (horaires théoriques, 20 Mo)
        uses: actions/cache@v4
        with:
          path: .cache
          key: gtfs-${{ github.run_id }}
          restore-keys: gtfs-
      - run: python -m tramdash
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
